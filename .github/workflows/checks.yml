name: Checks

on:
  push:
    branches: [main]
    paths-ignore:
      - "mkdocs.yml"
      - "docs/**"
      - "README.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "mkdocs.yml"
      - "docs/**"
      - "README.md"

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.sha }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect-modules:
    name: Detect packages to check
    runs-on: ubuntu-24.04
    outputs:
      modules: ${{ steps.detect.outputs.modules }}
      modules_count: ${{ steps.detect.outputs.modules_count }}
      has_testcontainers: ${{ steps.detect.outputs.has_testcontainers }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: detect
        name: Detect changed packages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          changed_files="${RUNNER_TEMP}/changed-files.txt"

          git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > "${changed_files}"

          modules="$(node ./.github/scripts/changed-modules.mjs < "${changed_files}")"
          modules_count="$(jq 'length' <<< "${modules}")"
          has_testcontainers="$(jq 'index("testcontainers") != null' <<< "${modules}")"

          echo "modules=${modules}" >> "${GITHUB_OUTPUT}"
          echo "modules_count=${modules_count}" >> "${GITHUB_OUTPUT}"
          echo "has_testcontainers=${has_testcontainers}" >> "${GITHUB_OUTPUT}"

          echo "${modules_count} packages in the build"
          echo "${modules}"

  lint:
    # Runs once for the whole repository instead of per module: Biome checks every file in well under a second, and
    # knip analyses all workspaces together and reads the manifests of their installed dependencies.
    name: "Lint"
    runs-on: ubuntu-24.04
    steps:
      - name: Code checkout
        uses: actions/checkout@v7
      - name: Install Node and Dependencies
        uses: ./.github/actions/npm-setup
        with:
          runner: ubuntu-24.04
          node-version: 24.x
      - name: Code linting
        run: npm run lint:ci
      - name: Find unused files, exports and dependencies
        run: npm run knip

  compile:
    # Runs once for the whole repository instead of per module: a project-references build type-checks every
    # package, tests included, in a few seconds.
    if: ${{ needs.detect-modules.outputs.modules_count != '0' }}
    name: Compile
    needs:
      - detect-modules
      - lint
    runs-on: ubuntu-24.04
    steps:
      - name: Code checkout
        uses: actions/checkout@v7
      - name: Install Node and Dependencies
        uses: ./.github/actions/npm-setup
        with:
          runner: ubuntu-24.04
          node-version: 24.x
      - name: Compile
        run: npm run check-compiles

  smoke-test:
    if: ${{ needs.detect-modules.outputs.has_testcontainers == 'true' }}
    needs:
      - detect-modules
      - lint
      - compile
    name: Smoke tests
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    runs-on: ubuntu-24.04
    steps:
      - name: Code checkout
        uses: actions/checkout@v7
      - name: Install Node ${{ matrix.node-version }} and Dependencies
        uses: ./.github/actions/npm-setup
        with:
          runner: ubuntu-24.04
          node-version: ${{ matrix.node-version }}
          workspace: "testcontainers"
      - name: Build testcontainers
        run: npm run build --workspace packages/testcontainers
      - name: Remove dev dependencies
        run: npm prune --omit=dev --workspace packages/testcontainers
      - name: Run CommonJS module smoke test
        run: node packages/testcontainers/smoke-test.js
        env:
          DEBUG: "testcontainers*"
      - name: Run ES module smoke test
        run: node packages/testcontainers/smoke-test.mjs
        env:
          DEBUG: "testcontainers*"
      - name: Run Jest CommonJS runtime smoke test
        run: npm exec --yes --package jest@30.4.2 -- jest --testMatch "**/smoke-test.jest.js" --runInBand --transform "{}"
        env:
          DEBUG: "testcontainers*"

  smoke-test-bun:
    if: ${{ needs.detect-modules.outputs.has_testcontainers == 'true' }}
    needs:
      - detect-modules
      - lint
      - compile
    name: Smoke tests (Bun)
    runs-on: ubuntu-24.04
    steps:
      - name: Code checkout
        uses: actions/checkout@v7
      - name: Install Node and Dependencies
        uses: ./.github/actions/npm-setup
        with:
          runner: ubuntu-24.04
          node-version: 24.x
          workspace: "testcontainers"
      - name: Build testcontainers
        run: npm run build --workspace packages/testcontainers
      - name: Remove dev dependencies
        run: npm prune --omit=dev --workspace packages/testcontainers
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Run CommonJS module smoke test
        run: bun packages/testcontainers/smoke-test.js
        env:
          DEBUG: "testcontainers*"
      - name: Run ES module smoke test
        run: bun packages/testcontainers/smoke-test.mjs
        env:
          DEBUG: "testcontainers*"

  test:
    if: ${{ needs.detect-modules.outputs.modules_count != '0' }}
    name: Tests
    needs:
      - detect-modules
      - lint
      - compile
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        module: ${{ fromJSON(needs.detect-modules.outputs.modules) }}
        node-version: [22.x, 24.x]
        container-runtime: [docker, podman]
    uses: ./.github/workflows/test-template.yml
    with:
      runner: ubuntu-24.04
      node-version: ${{ matrix.node-version }}
      container-runtime: ${{ matrix.container-runtime }}
      workspace: "${{ matrix.module }}"

  end:
    if: ${{ always() && needs.detect-modules.outputs.modules_count != '0' }}
    name: Checks complete
    needs:
      - detect-modules
      - lint
      - compile
      - smoke-test
      - smoke-test-bun
      - test
    runs-on: ubuntu-24.04
    steps:
      - name: Check if any jobs failed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - run: echo "All tests completed successfully!"
