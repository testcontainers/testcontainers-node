name: Node.js Package

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Dry run publish {0}', inputs.version) || format('Publish {0}', github.event.release.tag_name) }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to rehearse, with or without v prefix. Example: 12.0.1"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && 'main' || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Configure Git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Resolve version
        id: version
        env:
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$VERSION_INPUT"
          else
            TAG="$RELEASE_TAG_NAME"
          fi

          VERSION="${TAG#v}"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Update versions
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm version "$VERSION" --ws --allow-same-version --no-git-tag-version

          for module in packages/modules/*; do
            npm pkg set "dependencies.testcontainers=^$VERSION" -w "$module"
          done

          npm install --package-lock-only --ignore-scripts

          sed -i -E "s/(sonar.projectVersion)=.+/\1=$TAG/" sonar-project.properties

      - name: Build packages
        run: |
          npm ci
          npm run build --ws

      - name: Check packages
        run: |
          mkdir "$RUNNER_TEMP/unpublished"
          status=0

          for dir in packages/testcontainers packages/modules/*; do
            name=$(jq -r .name "$dir/package.json")
            echo "::group::$name"

            if ! npm view "$name" name > /dev/null 2> "$RUNNER_TEMP/npm-view.log"; then
              if ! grep -q E404 "$RUNNER_TEMP/npm-view.log"; then
                cat "$RUNNER_TEMP/npm-view.log"
                exit 1
              fi
              npm pack -w "$dir" --pack-destination "$RUNNER_TEMP/unpublished"
              echo "::endgroup::"
              echo "::warning::$name is not on npm yet, see RELEASING.md"
              continue
            fi

            npm publish -w "$dir" --dry-run --loglevel verbose 2>&1 | tee "$RUNNER_TEMP/npm-publish.log"
            echo "::endgroup::"
            if grep -q "oidc Successfully retrieved and set token" "$RUNNER_TEMP/npm-publish.log"; then
              echo "$dir" >> "$RUNNER_TEMP/publish-dirs.txt"
            else
              echo "::error::$name has no trusted publisher for this workflow, see RELEASING.md"
              status=1
            fi
          done

          exit "$status"

      - name: Git commit
        if: ${{ github.event_name == 'release' }}
        run: git commit -am "${{ steps.version.outputs.tag }}"

      - name: Git push
        if: ${{ github.event_name == 'release' }}
        run: git push

      - name: Publish packages to NPM
        if: ${{ github.event_name == 'release' }}
        run: |
          for dir in $(cat "$RUNNER_TEMP/publish-dirs.txt"); do
            if ! npm publish -w "$dir"; then
              echo "::error::Failed to publish $dir"
              npm pack -w "$dir" --pack-destination "$RUNNER_TEMP/unpublished"
            fi
          done

          if ls "$RUNNER_TEMP"/unpublished/*.tgz > /dev/null 2>&1; then
            echo "::error::Some packages are not on npm. Publish them from the unpublished-packages artifact, see RELEASING.md"
            exit 1
          fi

      - name: Upload unpublished packages
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unpublished-packages
          path: ${{ runner.temp }}/unpublished/*.tgz
          if-no-files-found: ignore
