name: "NPM Setup"
description: "Sets up Node.js and installs NPM dependencies with caching"

inputs:
  runner:
    description: "Runner to use"
    required: true
  node-version:
    description: "Node.js version to use"
    required: true
  workspace:
    description: "Workspace to resolve `workspace_path` for"
    required: false
    default: ""
  workspace-only:
    description: "Install only `workspace` and the root, with a cache of their own, instead of every workspace"
    required: false
    default: "false"

outputs:
  workspace_path:
    description: "Full path to the workspace directory"
    value: ${{ steps.set-workspace.outputs.workspace_path }}

runs:
  using: "composite"
  steps:
    - name: Set workspace path
      shell: bash
      id: set-workspace
      run: |
        if [ -z "${{ inputs.workspace }}" ]; then
          workspace_path=""
        elif [ "${{ inputs.workspace }}" = "testcontainers" ]; then
          workspace_path="packages/testcontainers"
        else
          workspace_path="packages/modules/${{ inputs.workspace }}"
        fi

        if [ "${{ inputs.workspace-only }}" != "true" ]; then
          cache_paths=$'node_modules\npackages/testcontainers/node_modules\npackages/modules/*/node_modules'
        elif [ -z "${workspace_path}" ]; then
          echo "::error::workspace-only needs a workspace"
          exit 1
        elif [ "${{ inputs.workspace }}" = "testcontainers" ]; then
          cache_paths=$'node_modules\npackages/testcontainers/node_modules'
        else
          cache_paths=$'node_modules\npackages/testcontainers/node_modules\n'"${workspace_path}/node_modules"
        fi

        echo "WORKSPACE_PATH=${workspace_path}" >> "$GITHUB_ENV"
        echo "workspace_path=${workspace_path}" >> "$GITHUB_OUTPUT"
        {
          echo "cache_paths<<EOF"
          echo "${cache_paths}"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Install NodeJS ${{ inputs.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false

    - name: Restore dependencies cache
      uses: actions/cache/restore@v4
      id: npm-cache
      with:
        path: ${{ steps.set-workspace.outputs.cache_paths }}
        key: npm-v2-${{ inputs.runner }}-node-${{ inputs.node-version }}-${{ inputs.workspace-only == 'true' && inputs.workspace || 'all-workspaces' }}-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies
      if: steps.npm-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        if [ "${{ inputs.workspace-only }}" = "true" ]; then
          npm ci --workspace "${WORKSPACE_PATH}" --include-workspace-root
        else
          npm ci
        fi

    - name: Save dependencies cache
      if: steps.npm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.set-workspace.outputs.cache_paths }}
        key: ${{ steps.npm-cache.outputs.cache-primary-key }}
