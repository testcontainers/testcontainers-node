name: "NPM Setup"
description: "Sets up Node.js and installs NPM dependencies with caching"

inputs:
  node-version:
    description: "Node.js version to use"
    required: true

runs:
  using: "composite"
  steps:
    - name: Install NodeJS ${{ inputs.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        package-manager-cache: false

    - name: Restore dependencies cache
      uses: actions/cache/restore@v4
      id: npm-cache
      with:
        path: |
          node_modules
          packages/testcontainers/node_modules
          packages/modules/*/node_modules
        key: npm-v3-${{ runner.os }}-${{ runner.arch }}-node-${{ inputs.node-version }}-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies
      if: steps.npm-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        # onnxruntime-node (a dev dependency of the chromadb module) otherwise downloads CUDA binaries on install.
        ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      run: npm ci

    - name: Save dependencies cache
      if: steps.npm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: |
          node_modules
          packages/testcontainers/node_modules
          packages/modules/*/node_modules
        key: ${{ steps.npm-cache.outputs.cache-primary-key }}
